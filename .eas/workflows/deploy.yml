name: Deploy to production

# Fires on every push to main. A merge from the GitHub mobile app is therefore
# the whole release trigger — see AGENTS.md for the remote-development setup.
on:
  push:
    branches: ['main']

jobs:
  test:
    name: Typecheck and test
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  # Hashes everything that affects the native runtime. Its output decides the
  # branch below: unchanged native layer means the change can ship over the air.
  fingerprint:
    name: Fingerprint
    needs: [test]
    type: fingerprint

  # Not the get-build job type: get-build skips builds whose artifact has
  # expired (30 days), so a JS-only push a month after the last native build
  # finds nothing and rebuilds an unchanged runtime. An OTA update only needs
  # the runtime to have shipped once, so any finished build counts, expired or
  # not. build_id stays unset when there is no match, as get-build left it.
  get_ios_build:
    name: Check for existing build
    needs: [fingerprint]
    outputs:
      build_id: ${{ steps.find.outputs.build_id }}
    steps:
      - uses: eas/checkout
      # eas-cli resolves the app config's plugins, which needs node_modules.
      - uses: eas/install_node_modules
      - id: find
        name: Find a build with this fingerprint
        run: |
          id=$(npx -y eas-cli@25.3.0 build:list --platform ios --build-profile production \
            --status finished --fingerprint-hash ${{ needs.fingerprint.outputs.ios_fingerprint_hash }} \
            --limit 1 --json --non-interactive \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s)[0]?.id??""))')
          echo "Matching build: ${id:-none}"
          if [ -n "$id" ]; then set-output build_id "$id"; fi

  # No build matches this fingerprint -> the native layer changed -> rebuild.
  build_ios:
    name: Build iOS
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}

  # A build already matches this fingerprint -> JS-only change -> ship OTA.
  publish_update:
    name: Publish OTA update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    params:
      branch: production
      platform: ios
